<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #terminal {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="terminal"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

    <script>
      const terminal = new Terminal({
        cursorBlink: true,
        fontFamily: 'monospace',
        fontSize: 14,
        theme: {
          background: '#000000',
          foreground: '#ffffff',
        },
      });

      terminal.open(document.getElementById('terminal'));

      terminal.write('\x1b[32mRN Terminal\x1b[0m\r\n');
      terminal.write('WebView + xterm.js is working!\r\n\r\n');
      terminal.write('$ ');
    </script>
  </body>
</html>
